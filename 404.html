<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — Страницата не е пронајдена | МОНЕТА</title>
<meta name="description" content="Страницата што ја барате не постои или е преместена. Вратете се на почетната страница на МОНЕТА — анатомски влошки." />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(1200px 600px at 50% -10%, #ffe3ec 0%, #fbf8f7 45%, #ffffff 100%);
    padding: 24px;
  }
  .box { text-align: center; max-width: 460px; }
  .code { font-size: 120px; font-weight: 800; line-height: 1; color: #EC1752; letter-spacing: -4px; }
  .code span { color: #17171C; }
  h1 { font-size: 22px; margin: 12px 0 8px; color: #17171C; }
  p { font-size: 15px; color: #8a8784; margin-bottom: 28px; line-height: 1.6; }
  a.btn {
    display: inline-block;
    padding: 14px 32px;
    background: #EC1752;
    color: #fff;
    text-decoration: none;
    border-radius: 999px;
    font-weight: 700;
    font-size: 15px;
    transition: background 0.2s, transform 0.2s;
  }
  a.btn:hover { background: #d41149; transform: translateY(-1px); }
  .logo { font-size: 15px; font-weight: 800; letter-spacing: 1px; color: #17171C; margin-bottom: 20px; }
  .logo span { color: #EC1752; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">MONETA<span>.</span></div>
    <div class="code">4<span>0</span>4</div>
    <h1>Страницата не е пронајдена</h1>
    <p>Страницата што ја барате не постои, е преместена или привремено недостапна. Вратете се на почетната за да ги видите нашите анатомски влошки.</p>
    <a href="/" class="btn">Врати се на почетната</a>
  </div>
</body>
</html>
